events {
    worker_connections 1024;
}

http {
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Upload size (for photo uploads)
    client_max_body_size 50M;

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name jollybook.duckdns.org;

        # Certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Docker internal DNS resolver — re-resolves backend hostname dynamically
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTPS
    server {
        listen 443 ssl;
        server_name jollybook.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/jollybook.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jollybook.duckdns.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /api/ {
            set $backend http://backend:3000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Replace (not append) so a client-supplied X-Forwarded-For cannot
            # spoof the source IP the backend rate limiter keys on.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (if needed)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Bulk Ozon publish can take several minutes for large boxes
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 10s;
        }

        location / {
            return 404;
        }
    }
}
